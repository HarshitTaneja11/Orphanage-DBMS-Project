<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - SORMS</title>
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background: linear-gradient(135deg, #f0f4fd 0%, #e0e7ff 100%);
            margin: 0;
            font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }
        .login-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
            border: 1px solid rgba(255,255,255,0.6);
        }
        .login-card h1 { margin-bottom: 10px; color: var(--accent-color); font-size: 32px; }
        .login-card p { margin-bottom: 30px; color: var(--text-secondary); }
        .form-group { text-align: left; margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 8px; font-weight: 500; color: var(--text-primary); }
        .form-control { width: 100%; padding: 12px; border: 1px solid var(--surface-border); border-radius: 8px; font-family: inherit; font-size: 16px; box-sizing: border-box; }
        .form-control:focus { outline: none; border-color: var(--accent-color); box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2); }
        .btn-primary { 
            width: 100%; padding: 14px; font-size: 16px; margin-top: 10px; 
            background: var(--accent-color); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: 600;
            text-align: center; display: flex; justify-content: center; align-items: center;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        #error-msg { color: #ef4444; margin-top: 15px; display: none; background: #fee2e2; padding: 10px; border-radius: 8px; font-size: 14px;}
    </style>
</head>
<body>
    <div class="login-card">
        <i class="fa-solid fa-hands-holding-child" style="font-size: 48px; color: #6366f1; margin-bottom: 16px;"></i>
        <h1>SORMS</h1>
        <p>Sign in to access the dashboard</p>
        <form id="login-form">
            <div class="form-group">
                <label>Username (Role)</label>
                <input type="text" id="username" class="form-control" placeholder="e.g. harshit_admin, harshit_staff" required>
            </div>
            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" required>
            </div>
            <button type="submit" class="btn-primary">Sign In</button>
            <div id="error-msg">Invalid credentials. Please try again.</div>
        </form>
    </div>
    <script>
        document.getElementById('login-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            
            try {
                const res = await fetch('http://localhost:3000/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username: u, password: p})
                });
                if(res.ok) {
                    localStorage.setItem('dbUser', u);
                    localStorage.setItem('dbPass', p);
                    window.location.href = 'index.html';
                } else {
                    document.getElementById('error-msg').style.display = 'block';
                }
            } catch (err) {
                document.getElementById('error-msg').style.display = 'block';
            }
        });
    </script>
</body>
</html>
